project:
  type: website
  output-dir: _site
  render:
    - index.md
    - discussions.md
    - guide/*.md
    - background/construction.md
    - mechanics/timeline.md
    - mechanics/gp.md
    - collectibles/achievements.md
    - collectibles/gallery.md
    - collectibles/timeline-completion.md
  resources:
    - assets/ending-layout.css
    - assets/completion-finder.js
    - assets/completion-finder.css
    - assets/achievement-finder.js
    - assets/achievement-finder.css
    - assets/gallery-finder.js
    - assets/gallery-finder.css
    - assets/timeline-finder.js
    - assets/timeline-finder.css
    - assets/jd-home.js
    - assets/home-visual/
    - assets/guide-lookup.js
    - assets/jd-mobile-shell.js
    - assets/fonts/
    - assets/favicon.svg
    - assets/favicon-32x32.png
    - assets/apple-touch-icon.png
    - assets/social/jurodo-guide-zh.png
    - CNAME
  post-render:
    - python3 scripts/build-search.py
    - python3 scripts/finalize-publication.py
    - python3 scripts/verify-release.py

lang: zh-CN
website:
  title: "兽劳动"
  site-url: https://jurodo.carambi.com
  open-graph:
    locale: zh_CN
    image: /assets/social/jurodo-guide-zh.png
    image-alt: "《兽劳动》非官方玩家攻略，背景为夏日施工现场。"
  twitter-card:
    card-style: summary_large_image
    image: /assets/social/jurodo-guide-zh.png
    image-alt: "《兽劳动》非官方玩家攻略，背景为夏日施工现场。"
  page-footer:
    center: |
      <div class="jd-publication-footer"><p>非官方中文玩家攻略 · 兽劳动 1.3.0</p><div class="jd-publication-footer-links"><span>由 <a class="jd-carambi-link" href="https://carambi.com/zh/">Carambi</a> 维护</span><button class="jd-feedback-slot" type="button" disabled title="私下反馈需要启用 JavaScript">私下反馈</button><a href="#">↑ 返回顶部</a></div></div>
  search: false
  navbar:
    title: >-
      <span class="kt-brand-name">兽劳动</span>
      <span class="kt-brand-edition" aria-hidden="true">攻略 · 1.3.0</span>
    pinned: true
    collapse: false
    left:
      - text: 首页
        href: index.md
      - text: 日期
        href: guide/index.md
      - text: 结局
        href: guide/endings.md
      - text: 收集
        menu:
          - text: 成就
            href: collectibles/achievements.md
          - text: 图库
            href: collectibles/gallery.md
          - text: 时间线 100% 补收
            href: collectibles/timeline-completion.md
      - text: 机制
        menu:
          - text: 时间线
            href: mechanics/timeline.md
          - text: GP
            href: mechanics/gp.md
      - text: 背景
        href: background/construction.md
format:
  html:
    toc: true
    toc-location: left
    toc-depth: 2
    toc-title: 本页目录
    grid:
      sidebar-width: 190px
      body-width: 940px
      margin-width: 165px
      gutter-width: 22px
    theme:
      light: [default]
      dark: [default, assets/kt-dark.scss]
    respect-user-color-scheme: true
    css:
      - assets/kt-foundation.css
      - assets/kt-publication.css
      - assets/guide.css
      - assets/jd-mobile-shell.css
      - assets/jd-discussion.css
      - assets/jd-feedback.css
    include-in-header:
      - assets/jd-discussion-config.html
      - text: |
          <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
          <link rel="icon" type="image/svg+xml" sizes="any" href="/assets/favicon.svg">
          <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    include-after-body:
      - assets/cloudflare-web-analytics.html
      - assets/guide-search.html
      - assets/jd-discussion-remote.html
      - assets/jd-discussion-runtime.html
      - assets/jd-discussion-ui.html
      - assets/jd-discussion-hub.html
      - assets/jd-feedback-ui.html
    anchor-sections: false
